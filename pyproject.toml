[project]
name = "bouldering2d"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6",
    "gymnasium>=0.29",
    "stable-baselines3[extra]>=2.3",
    "numpy>=1.26",
    "tensorboard>=2.16",
    "imageio[ffmpeg]>=2.34",
    "tqdm>=4.67.3",
    "torch>=2.4,<2.11",
    "moviepy>=2.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
